<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>謝雲卿案 下營598-3 1F–3F＋屋頂 3D 漫遊</title>
<style>
  html,body { margin:0; height:100%; overflow:hidden; background:#0d0d0f; font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif; touch-action:none; -webkit-user-select:none; user-select:none; }
  canvas { display:block; }
  #toggle { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:10px; z-index:20; background:rgba(20,20,22,.78); color:#fff; border:none; border-radius:10px; padding:9px 13px; font-size:16px; }
  #modeBtn { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:10px; z-index:20; background:rgba(217,178,106,.92); color:#111; border:none; border-radius:10px; padding:9px 13px; font-size:15px; }
  #panel { position:absolute; top:calc(56px + env(safe-area-inset-top)); left:10px; z-index:10; width:310px; max-width:calc(100% - 20px); max-height:calc(100% - 80px); overflow:auto; color:#eee; background:rgba(20,20,22,.82); border-radius:12px; padding:12px 14px; font-size:13.5px; line-height:1.5; transition:transform .25s, opacity .25s; box-sizing:border-box; }
  #panel.collapsed { transform:translateX(-115%); opacity:0; pointer-events:none; }
  #panel h3 { margin:0 0 6px; font-size:15px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:7px 0; }
  .row select, .row input[type=range] { flex:1; min-width:0; }
  select { background:#2a2a2e; color:#fff; border:1px solid #444; border-radius:6px; padding:4px; font-size:13px; }
  .go { background:#2d2d32; color:#ddd; border:1px solid #444; border-radius:8px; padding:5px 9px; font-size:13px; margin:2px; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#ddd; font-size:16px; background:#0d0d0f; z-index:30; }
  #joy { position:absolute; left:30px; bottom:calc(40px + env(safe-area-inset-bottom)); width:100px; height:100px; border-radius:50%; border:2px solid rgba(255,255,255,.5); background:rgba(255,255,255,.08); z-index:5; pointer-events:none; }
  #hint { position:absolute; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); color:#fff; background:rgba(20,20,22,.6); padding:5px 10px; border-radius:8px; font-size:12px; z-index:5; }
  small { color:#aaa; }
  #floorBtn { position:absolute; top:calc(54px + env(safe-area-inset-top)); right:10px; z-index:20; background:rgba(30,30,30,.85); color:#d9b26a; border:1px solid #d9b26a; border-radius:10px; padding:8px 12px; font-size:14px; }
  #floorBtn.on { background:#d9b26a; color:#111; }
  #floorBox { display:none; position:absolute; top:calc(96px + env(safe-area-inset-top)); right:10px; z-index:20; background:rgba(0,0,0,.7); color:#fff; border-radius:10px; padding:6px 10px; gap:6px; align-items:center; font-size:13px; }
</style>
</head>
<body>
<div id="loading"><span id="loadtxt">載入中…</span></div>
<button id="toggle">☰ 面板</button>
<button id="modeBtn">切換</button><button id="floorBtn">貼地看磚</button><div id="floorBox"><span>眼高</span><input id="floorH" type="range" min="5" max="60" value="20"><span id="floorHv">20 cm</span></div>
<div id="joy"></div>
<div id="panel">
  <h3>謝雲卿案｜下營營和段598-3 透天三層</h3>
  <div>樓層：
    <button class="go" data-p="330,610,0,1">一樓 1F</button>
    <button class="go" data-p="380,470,0.35,2">二樓 2F</button>
    <button class="go" data-p="300,330,0.2,3">三樓 3F</button>
    <button class="go" data-p="300,420,0.4,4">屋頂</button>
    <button class="ext go">外觀</button>
  </div>
  <div>1F：
    <button class="go" data-p="230,1120,0,1">車庫入口</button>
    <button class="go" data-p="360,720,0,1">玄關</button>
    <button class="go" data-p="330,610,0,1">客廳</button>
    <button class="go" data-p="170,340,0,1">廚房</button>
    <button class="go" data-p="170,40,1.5708,1">樓梯口</button>
    <button class="go" data-p="300,-200,3.1416,1">後院</button>
  </div>
  <div>2F：
    <button class="go" data-p="380,470,0.35,2">起居室</button>
    <button class="go" data-p="370,700,2.2,2">主臥室</button>
    <button class="go" data-p="380,560,1.5708,2">浴廁</button>
    <button class="go" data-p="260,60,0,2">陽台</button>
    <button class="go" data-p="200,455,1.5708,2">樓梯</button>
  </div>
  <div>3F：
    <button class="go" data-p="300,330,0.2,3">家事間</button>
    <button class="go" data-p="370,700,2.2,3">臥室</button>
    <button class="go" data-p="380,560,1.5708,3">浴廁</button>
    <button class="go" data-p="300,180,0.3,3">露臺</button>
    <button class="go" data-p="250,450,1.5708,3">樓梯</button>
  </div>
  <div class="row">俯瞰樓層 <select id="orbitLv"><option value="1">1F</option><option value="2">2F</option><option value="3">3F</option><option value="4">屋頂</option><option value="0">外觀</option></select></div>
  <div class="row">方案 <select id="scheme"></select></div>
  <div class="row">區域 <select id="zone"></select></div>
  <div class="row">磁磚 <select id="style"></select></div>
  <div class="row">鋪法 <select id="pattern"><option value="grid">直鋪（對縫）</option><option value="half">1/2 錯縫</option><option value="third">1/3 錯縫</option></select></div>
  <div class="row">縫寬 <input type="range" id="groutW" min="1" max="10" step="0.5"><span id="groutWv"></span></div>
  <div class="row">縫色 <input type="color" id="groutC"></div>
  <div class="row"><button class="btn" id="ptBtn">出效果圖（路徑追蹤）</button></div>
  <div class="row">光照 <select id="lighting"><option value="bake">烘焙 GI 光照圖</option><option value="rt">即時光照</option></select></div>
  <div class="row">畫質 <select id="quality"><option value="high">高（電腦）</option><option value="mobile">手機</option></select></div>
  <small>依 p.3 一／二層平面圖（1:100）、p.4 參層／屋頂、p.5–7 立剖面、p.8 樓梯、p.7 剖面、p.11 材料粉刷表建模；磁磚以郭怡華案產品代用。<br>手機：左下拖曳＝移動，右側拖曳＝轉頭。電腦：WASD／方向鍵＋滑鼠拖曳。<br>家具：Poly Haven CC0。</small>
  <div><a href="../" style="color:#d9b26a">← 磁磚模擬器</a></div>
</div>
<div id="hint">一樓 1F｜層高 340 cm</div>
<script>Promise.all([0,1].map(i=>fetch("y"+i+".js?v=12").then(r=>r.text()))).then(p=>import(URL.createObjectURL(new Blob([p.join("")],{type:"text/javascript"}))));</script>
<div id="ptBox" style="display:none;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(20,18,16,.82);color:#fff;padding:8px 12px;border-radius:10px;font-size:14px;z-index:20"><span id="ptTxt"></span> <button class="btn" id="ptSave">下載 PNG</button> <button class="btn" id="ptClose">關閉</button></div>
</body>
</html>
