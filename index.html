<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>磁磚高擬真室內模擬器</title>
<style>
  html,body { margin:0; height:100%; overflow:hidden; background:#0d0d0f; font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif; touch-action:none; }
  canvas { display:block; }
  #toggle { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:10px; z-index:20; background:rgba(20,20,22,.78); color:#fff; border:none; border-radius:10px; padding:9px 13px; font-size:16px; backdrop-filter:blur(6px); }
  #panel { position:absolute; top:calc(56px + env(safe-area-inset-top)); left:10px; z-index:10; width:300px; max-height:calc(100% - 80px); overflow:auto; color:#eee; background:rgba(20,20,22,.78); backdrop-filter:blur(8px); border-radius:12px; padding:12px 14px; font-size:13.5px; line-height:1.5; transition:transform .25s, opacity .25s; }
  #panel.collapsed { transform:translateX(-115%); opacity:0; pointer-events:none; }
  #panel h3 { margin:0 0 6px; font-size:15px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:7px 0; }
  .row select, .row input[type=range] { flex:1; min-width:0; }
  select { background:#2a2a2e; color:#fff; border:1px solid #444; border-radius:6px; padding:4px; font-size:13px; }
  .rooms { display:flex; gap:6px; flex-wrap:wrap; }
  .roomBtn, .btn { background:#2d2d32; color:#ddd; border:1px solid #444; border-radius:8px; padding:6px 10px; font-size:13px; }
  .roomBtn.on { background:#d9b26a; color:#111; border-color:#d9b26a; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#ddd; font-size:16px; background:#0d0d0f; z-index:30; }
  #roomName { position:absolute; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); color:#fff; background:rgba(20,20,22,.6); padding:5px 10px; border-radius:8px; font-size:13px; z-index:5; }
  small { color:#aaa; }
</style>
</head>
<body>
<div id="loading"><span id="loadtxt">載入中…</span></div>
<button id="toggle">☰ 面板</button>
<div id="panel">
  <h3>磁磚高擬真室內模擬器</h3>
  <div class="rooms">
    <button class="roomBtn" data-room="living">客廳＋廚房</button>
    <button class="roomBtn" data-room="bath">浴室</button>
    <button class="roomBtn" data-room="garage">車庫</button>
  </div>
  <div class="row">地磚 <select id="style"></select></div>
  <div class="row" id="wallRow">壁磚 <select id="wallStyle"></select></div>
  <div class="row">鋪法 <select id="pattern"><option value="grid">直鋪（對縫）</option><option value="half">1/2 錯縫</option><option value="third">1/3 錯縫</option></select></div>
  <div class="row">縫寬 <input type="range" id="groutW" min="1" max="10" step="0.5"><span id="groutWv"></span></div>
  <div class="row">縫色 <input type="color" id="groutC"></div>
  <div class="row">粗糙度 <input type="range" id="rough" min="0.04" max="0.9" step="0.01"><span id="roughV"></span></div>
  <div class="row"><label><input type="checkbox" id="polished"> 拋光反射</label></div>
  <div class="row"><button class="btn" id="top">俯視</button><button class="btn" id="reset">室內視角</button></div>
  <div class="row">畫質 <select id="quality"><option value="high">高（電腦）</option><option value="mobile">手機</option></select></div>
  <small>單指旋轉 · 雙指縮放／平移<br>家具模型與 HDRI：Poly Haven (CC0)</small>
</div>
<div id="roomName"></div>
<script>Promise.all([0,1,2,3].map(i=>fetch("a"+i+".js?v=5").then(r=>r.text()))).then(p=>import(URL.createObjectURL(new Blob([p.join("")],{type:"text/javascript"}))));</script>
</body>
</html>
