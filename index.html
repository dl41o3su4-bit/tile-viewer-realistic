<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>磁磚高擬真觀察器</title>
<style>
  body { margin: 0; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
  #panel {
    position: absolute; top: 12px; left: 12px; color: #fff;
    background: rgba(0,0,0,0.65); padding: 14px 16px; border-radius: 10px;
    font-size: 14px; max-width: 280px; line-height: 1.5; z-index: 10;
    transition: transform 0.25s ease, opacity 0.25s;
  }
  #panel.collapsed { transform: translateX(-110%); opacity: 0; pointer-events: none; }
  #toggle {
    position: absolute; top: 12px; left: 12px; z-index: 20;
    background: rgba(0,0,0,0.7); color: #fff; border: none; border-radius: 8px;
    padding: 8px 12px; cursor: pointer; font-size: 16px;
  }
  #controls {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.65); color: #fff; padding: 10px 16px; border-radius: 8px;
    display: flex; gap: 14px; align-items: center; z-index: 10; flex-wrap: wrap; justify-content: center;
  }
  canvas { display: block; }
  label { display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<button id="toggle">☰ 面板</button>
<div id="panel">
  <strong>客廳 80×80 淺灰石紋</strong><br>
  空間 4.2 × 3.6 m<br>
  Poly Haven marble_tiles PBR<br>
  單指拖曳旋轉 · 滾輪縮放<br>
  <small>點左上按鈕可收納面板</small>
</div>
<div id="controls">
  <label>粗糙度 <input type="range" id="rough" min="0.08" max="0.85" step="0.02" value="0.22"></label>
  <span id="roughVal">0.22</span>
  <label>縫寬 <input type="range" id="groutW" min="0.005" max="0.04" step="0.002" value="0.012"></label>
  <label>縫色 <input type="color" id="groutC" value="#8a8680"></label>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3.2, 1.5, 3.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.04;

const ambient = new THREE.AmbientLight(0xffffff, 0.35);
scene.add(ambient);
const dir = new THREE.DirectionalLight(0xfff4e0, 1.15);
dir.position.set(3.5, 5.5, 2.5);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
scene.add(dir);

const roomW = 4.2, roomD = 3.6, tile = 0.8;
const repeatX = roomW / tile;
const repeatZ = roomD / tile;

const loader = new THREE.TextureLoader();
loader.setCrossOrigin("anonymous");

const diff = loader.load("https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/marble_tiles/marble_tiles_diff_2k.jpg");
const nor = loader.load("https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/marble_tiles/marble_tiles_nor_gl_2k.jpg");
const roughTex = loader.load("https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/marble_tiles/marble_tiles_rough_2k.jpg");

[diff, nor, roughTex].forEach(t => {
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatZ);
  t.anisotropy = 16;
});
diff.colorSpace = THREE.SRGBColorSpace;

const floorMat = new THREE.MeshPhysicalMaterial({
  map: diff,
  normalMap: nor,
  roughnessMap: roughTex,
  roughness: 0.22,
  metalness: 0.0,
  clearcoat: 0.15,
  clearcoatRoughness: 0.25,
  envMapIntensity: 0.9
});

const groutUniforms = {
  uGroutWidth: { value: 0.012 },
  uGroutColor: { value: new THREE.Color("#8a8680") }
};
floorMat.onBeforeCompile = (shader) => {
  shader.uniforms.uGroutWidth = groutUniforms.uGroutWidth;
  shader.uniforms.uGroutColor = groutUniforms.uGroutColor;
  shader.fragmentShader = shader.fragmentShader.replace(
    '#include <map_fragment>',
    `#include <map_fragment>
    vec2 uvTile = vUv * vec2(${repeatX.toFixed(3)}, ${repeatZ.toFixed(3)});
    vec2 grid = abs(fract(uvTile - 0.5) - 0.5);
    float grout = smoothstep(uGroutWidth, uGroutWidth * 0.4, min(grid.x, grid.y));
    diffuseColor.rgb = mix(uGroutColor, diffuseColor.rgb, grout);`
  );
};

const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomW, roomD), floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

const wallMat = new THREE.MeshStandardMaterial({ color: 0xf4f1ec, roughness: 0.75 });
const wallH = 2.65;
function addWall(w, h, x, y, z, ry) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.1), wallMat);
  m.position.set(x, y, z);
  m.rotation.y = ry;
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
}
addWall(roomW+0.1, wallH, 0, wallH/2, -roomD/2, 0);
addWall(roomW+0.1, wallH, 0, wallH/2, roomD/2, 0);
addWall(roomD+0.1, wallH, -roomW/2, wallH/2, 0, Math.PI/2);
addWall(roomD+0.1, wallH, roomW/2, wallH/2, 0, Math.PI/2);

const sofa = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.65, 0.8), new THREE.MeshStandardMaterial({ color: 0xd8d2c8, roughness: 0.65 }));
sofa.position.set(-0.5, 0.32, -0.85);
sofa.castShadow = true;
scene.add(sofa);

const table = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.42, 0.65), new THREE.MeshStandardMaterial({ color: 0xc9b9a2, roughness: 0.55 }));
table.position.set(0.75, 0.21, 0.35);
table.castShadow = true;
scene.add(table);

const toggleBtn = document.getElementById("toggle");
const panel = document.getElementById("panel");
toggleBtn.onclick = () => panel.classList.toggle("collapsed");

const roughSlider = document.getElementById("rough");
const roughVal = document.getElementById("roughVal");
roughSlider.oninput = () => {
  const v = parseFloat(roughSlider.value);
  floorMat.roughness = v;
  roughVal.textContent = v.toFixed(2);
};

const groutW = document.getElementById("groutW");
groutW.oninput = () => { groutUniforms.uGroutWidth.value = parseFloat(groutW.value); };

const groutC = document.getElementById("groutC");
groutC.oninput = () => { groutUniforms.uGroutColor.value.set(groutC.value); };

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.onresize = () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
};
</script>
</body>
</html>
